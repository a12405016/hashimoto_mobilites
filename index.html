<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2040年橋本会話記録</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="archive.css">
    <meta name="keywords" content="2040年, 橋本未来, 会話記録, アーカイブ, YAMAHA Mobilit.E.S">
    <meta name="author" content="2040年橋本会話記録">
    <meta name="description" content="2040年橋本会話記録のアーカイブページです。">
    <link rel="icon" type="image/png" href="images/jiku.png">
</head>

<body>
    <!-- CRT背景エフェクト -->
    <div class="crt-bg">
        <div class="fx fx-dots"></div>
        <div class="fx fx-scan"></div>
        <div class="fx fx-roll"></div>
        <div class="fx fx-noise"></div>
        <div class="fx fx-vignette"></div>
    </div>

    <main>
        <div class="area-banner">2040年橋本会話記録</div>

        <article id="article0">
            <!-- すりガラス風のパネルで囲む -->
            <div class="collection-panel">
                <div class="collection-header">
                    <h2 class="collection-title">時空の修復</h2>
                    <span class="collection-count" id="progressCount">0 / 7</span>
                </div>

                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressFill" style="width: 0%;"></div>
                </div>
            </div>

            <div class="stamp-grid" id="grid">
                <!-- JSで動的に生成されます -->
            </div>

            <!-- EXコンテンツ（8つ目）：通常のスタンプと同じ見た目 -->
            <section class="ex-section" id="exSection" aria-label="EXコンテンツ" hidden>
                <div class="ex-title-label"><span>ー Extra Stage ー</span></div>
                <div class="stamp-grid ex-grid">
                    <div class="stamp-item locked" id="exCard" data-state="locked" role="button" tabindex="0"></div>
                </div>
                <p class="ex-hint" id="exHint"></p>
                <button type="button" class="btn-outline ex-cta" id="exCta" hidden>
                    <span class="btn-main-text">トゥルーエンドを見る</span>
                </button>
            </section>

            <!-- 「向かわない」を選んだ人だけに表示：選択をやり直すボタン -->
            <div class="choice-retry" id="choiceRetry" hidden>
                <button type="button" class="btn-outline retry-btn" id="choiceRetryBtn">
                    <span class="btn-main-text">選択肢を変更する</span>
                </button>
            </div>
        </article>

        <!-- ボタンエリア -->
        <div class="button-group">
            <a href="https://www.yamaha-motor.co.jp/mobilites/" target="_blank" class="btn-outline">
                <span class="btn-main-text">YAMAHA Mobilit.E.S 公式サイト<span class="arrow-icon">↗</span></span>
                <span class="btn-sub-text">外部サイトにアクセスします</span>
            </a>

            <a id="surveyBtn" class="btn-outline btn-survey is-locked" data-href="https://forms.gle/9RTJ66fP92t5uNCx6"
                target="_blank" rel="noopener" aria-disabled="true">
                <span class="btn-main-text">2040年の記憶を記録する<span class="arrow-icon" id="surveyIcon">🔒</span></span>
                <span class="btn-sub-text" id="surveySub">7つすべて解放すると開放されます</span>
            </a>
        </div>
    </main>

    <!-- 背景装飾 -->
    <div class="bg-decorations"></div>

    <!-- トースト通知 -->
    <div id="toast" class="toast"></div>

    <!-- ポップアップ（既存のまま） -->
    <div id="popupOverlay" class="popup-overlay" onclick="closePopup()"></div>
    <div id="popup" class="popup-content">
        <button class="popup-close-x" onclick="closePopup()">✕</button>

        <div class="popup-header">
            <span id="popNo" class="popup-no">No.1</span>
            <h3 id="popTitle" class="popup-title">将軍の孫</h3>
        </div>

        <div class="popup-img-wrapper">
            <img id="popImg" src="" alt="" class="popup-img">
        </div>

        <div class="popup-info">
            <div class="info-group no-border">
                <span class="info-label" id="popLabel">オーパーツ説明</span>
                <div class="story-box">
                    <p id="popStory"></p>
                </div>
            </div>

            <!-- 会話記録（音声）：音声が設定されているアイテムのみ表示 -->
            <div class="info-group no-border audio-group" id="popAudioGroup" hidden>
                <span class="info-label">会話記録（音声）</span>
                <div class="audio-player" id="audioPlayer">
                    <button type="button" class="audio-btn" id="audioBtn" aria-label="再生"></button>
                    <div class="audio-main">
                        <div class="audio-title" id="audioTitle">会話記録</div>
                        <input type="range" class="audio-seek" id="audioSeek" min="0" max="100" value="0" step="0.1"
                            aria-label="再生位置">
                        <div class="audio-time"><span id="audioCur">0:00</span><span id="audioDur">0:00</span></div>
                    </div>
                </div>
                <audio id="popAudio" preload="metadata"></audio>
            </div>
        </div>

        <div class="button-group popup-buttons">
            <a id="popLink" href="#" target="_blank" class="btn-outline">
                <span class="btn-main-text">YAMAHA Mobilit.E.S 公式サイト<span class="arrow-icon">↗</span></span>
                <span class="btn-sub-text">外部サイトにアクセスします</span>
            </a>
            <button class="btn-outline btn-close" onclick="closePopup()">
                <span class="btn-main-text">閉じる</span>
            </button>
        </div>
    </div>

    <!-- エンド映像（通常エンド／トゥルーエンド共通） -->
    <div id="videoOverlay" class="video-overlay" hidden>
        <video id="endVideo" playsinline webkit-playsinline controls controlsList="nodownload" preload="none"></video>
        <p id="videoMsg" class="video-msg"></p>
        <button type="button" id="videoBack" class="btn-outline video-back">
            <span class="btn-main-text">戻る</span>
        </button>
    </div>

    <script src="archive.js"></script>
</body>

</html>
